<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Stopwatch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
 footer {
    margin-top: 25px;
    color: #38bdf8;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1px;
}

      .stopwatch-container {
        background: #1e293b;
        width: 90%;
        max-width: 450px;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      h1 {
        color: white;
        font-size: 28px;
        margin-bottom: 30px;
      }

      .stopwatch {
        background: #020617;
        padding: 30px 15px;
        border-radius: 12px;
        border: 2px solid #38bdf8;
        margin-bottom: 25px;
      }

      .timer {
        color: #38bdf8;
        font-size: 50px;
        letter-spacing: 3px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        padding: 12px 25px;
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .start-btn {
        background: #16a34a;
      }

      .pause-btn {
        background: #f59e0b;
      }

      .reset-btn {
        background: #dc2626;
      }

      button:hover {
        transform: translateY(-3px);
        opacity: 0.85;
      }

      .status {
        color: #94a3b8;
        margin-top: 25px;
        font-size: 14px;
      }

      /* Tablet */
      @media screen and (max-width: 768px) {
        .stopwatch-container {
          width: 85%;
          padding: 30px 20px;
        }

        h1 {
          font-size: 25px;
        }

        .timer {
          font-size: 42px;
        }

        button {
          padding: 11px 20px;
          font-size: 15px;
        }
      }

      /* Mobile */
      @media screen and (max-width: 480px) {
        .stopwatch-container {
          width: 92%;
          padding: 25px 15px;
        }

        h1 {
          font-size: 22px;
          margin-bottom: 25px;
        }

        .stopwatch {
          padding: 25px 10px;
        }

        .timer {
          font-size: 32px;
          letter-spacing: 2px;
        }

        .buttons {
          gap: 8px;
        }

        button {
          padding: 10px 16px;
          font-size: 14px;
        }

        .status {
          font-size: 13px;
        }
      }

      /* Small Mobile */
      @media screen and (max-width: 350px) {
        .timer {
          font-size: 26px;
          letter-spacing: 1px;
        }

        .buttons {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="stopwatch-container">
    
      <h1>Digital Stopwatch</h1>
      <div class="stopwatch">
        <h2 class="timer">00:00:00</h2>
      </div>

      <div class="buttons">
        <button class="start-btn">Start</button>
        <button class="pause-btn">Pause</button>
        <button class="reset-btn">Reset</button>
      </div>

      <p class="status">⏱️ Every Second Counts. Let's Start!</p>

          <footer>
    <p>Designed & Developed by Eng. Nur Abdi ❤️ ❤️</p>
</footer>
    </div>

    <script src="/Digital Stopwatch/script.js"></script>
  </body>
</html>
